$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  slug:
    description: Event slug, lowercase words separated by hyphens
    title: Slug
    type: string
  name:
    title: Name
    type: string
  network:
    description: Stellar network the event ran on
    enum:
    - pubnet
    - testnet
    - futurenet
    title: Network
    type: string
  starts_at:
    description: Official start, UTC
    format: date-time
    title: Starts At
    type: string
  ends_at:
    description: Official submission deadline, UTC
    format: date-time
    title: Ends At
    type: string
  source_url:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Where the dataset is produced
    title: Source Url
required:
- slug
- name
- network
- starts_at
- ends_at
title: EventFile
type: object
